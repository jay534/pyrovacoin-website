<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">PyrovaCoin Logo</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">PyrovaCoin PYR cryptocurrency coin logo with fire design</desc>

<defs>
  <radialGradient id="coinGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFD700"/>
    <stop offset="40%" stop-color="#FF8C00"/>
    <stop offset="100%" stop-color="#CC4400"/>
  </radialGradient>
  <radialGradient id="coinInner" cx="45%" cy="40%" r="55%">
    <stop offset="0%" stop-color="#FFF0A0"/>
    <stop offset="50%" stop-color="#FFB800"/>
    <stop offset="100%" stop-color="#FF6000"/>
  </radialGradient>
  <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FF4500" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#FF4500" stop-opacity="0"/>
  </radialGradient>
  <filter id="softShadow">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF4500" flood-opacity="0.5"/>
  </filter>
</defs>

<!-- Glow background -->
<ellipse cx="340" cy="250" rx="170" ry="170" fill="url(#glowGrad)" style="stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

